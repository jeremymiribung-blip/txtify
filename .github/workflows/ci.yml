name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy (pedantic)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-features -- -D warnings -W clippy::pedantic

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Build release (binary <15MB without sidecar)
        run: cargo build --release --verbose

      - name: Check binary size (<15MB)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="target/release/txtify.exe"
          else
            BIN="target/release/txtify"
          fi
          if [ -f "$BIN" ]; then
            SIZE=$(stat -c%s "$BIN" 2>/dev/null || stat -f%z "$BIN" 2>/dev/null || wc -c < "$BIN")
            echo "Binary size: $SIZE bytes"
            MAX=$((15*1024*1024))
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "ERROR: binary exceeds 15MB: $SIZE > $MAX"
              exit 1
            fi
            ls -lh "$BIN"
          else
            echo "Binary not found at $BIN"
            exit 1
          fi

      - name: Verify sidecar exists
        shell: bash
        run: |
          ls -lh sidecar/txtify_sidecar.py sidecar/requirements.txt

      - name: Bench compilation check
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --bench conversion --no-run

  clippy-fmt:
    name: clippy-fmt-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features -- -D warnings -W clippy::pedantic
      - run: cargo test --all-features
      - run: cargo build --release
