[package]
name = "txtify"
version = "0.1.3"
edition = "2021"
description = "Hybrid document-to-text converter - Fast (pure Rust) vs High-Quality (GLM-OCR sidecar)"
license = "MIT OR Apache-2.0"
authors = ["txtify contributors"]
repository = "https://github.com/jeremymiribung-blip/txtify"
homepage = "https://github.com/jeremymiribung-blip/txtify"
readme = "README.md"
keywords = ["ocr", "conversion", "pdf", "docx", "markdown", "cli"]
categories = ["text-processing", "command-line-utilities"]
exclude = ["/target", ".github"]
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
docx-rs = "0.4"
calamine = "0.36"
html2md = "0.2"
mime_guess = "2"
encoding_rs = "0.8"
zip = "8"
quick-xml = "0.31"
lopdf = "0.42"
pdf-extract = "0.12"
indicatif = "0.17"
toml = "0.8"
[target.'cfg(windows)'.dependencies]
winreg = { version = "0.52", optional = true }

[features]
default = []
glm = []
shell = ["winreg"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
lopdf = "0.42"

[[test]]
name = "fast_converters"
path = "tests/integration/fast_converters.rs"

[[test]]
name = "glm_sidecar"
path = "tests/integration/glm_sidecar.rs"

[[bench]]
name = "conversion"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "dev"

[profile.dev]
panic = "unwind"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Pedantic noise allowances — keep strict for logic but allow stylistic noise
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
items_after_statements = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
